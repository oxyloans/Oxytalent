version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
        - npm --version
        - npm ci

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - "**/*"

  cache:
    paths:
      - node_modules/**/*

  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=0, must-revalidate"

customRules:
  - source: "/<*>"
    target: "/index.html"
    status: "200"